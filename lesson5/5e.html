<!DOCTYPE html>
<html>
<head>
    <title>Cost Calculator</title>
</head>
<body>
    <script>
        const cost = 5 + 2 * 3 + 9;
        document.write(`<p>Cost of food: $${cost}</p>`);
        console.log(`Cost of food: $${cost}`);
        const tax = cost * 0.1;
        document.write(`<p>Tax: $${tax}</p>`);
    </script>
</body>
</html>
